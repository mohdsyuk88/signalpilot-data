# One-off check of which exchange APIs this runner network can reach (used to choose the funding / open-interest source for research).
name: Probe exchange APIs
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          probe() { printf '%-9s %s -> ' "$1" "$2"; curl -s -o /tmp/o -w '%{http_code}' -m 15 "$2"; echo "  $(head -c 140 /tmp/o | tr '\n' ' ')"; }
          probe binance "https://fapi.binance.com/fapi/v1/fundingRate?symbol=BTCUSDT&limit=1"
          probe bybit   "https://api.bybit.com/v5/market/funding/history?category=linear&symbol=BTCUSDT&limit=2"
          probe bybit   "https://api.bybit.com/v5/market/open-interest?category=linear&symbol=BTCUSDT&intervalTime=5min&limit=2"
          probe okx     "https://www.okx.com/api/v5/public/funding-rate-history?instId=BTC-USDT-SWAP&limit=2"
          probe okx     "https://www.okx.com/api/v5/rubik/stat/contracts/open-interest-history?instId=BTC-USDT-SWAP&period=5m&limit=2"
          probe okx     "https://www.okx.com/api/v5/public/open-interest?instType=SWAP&instId=BTC-USDT-SWAP"
          probe bitget  "https://api.bitget.com/api/v2/mix/market/history-fund-rate?symbol=BTCUSDT&productType=USDT-FUTURES&pageSize=2"
