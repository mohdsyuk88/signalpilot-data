# Records crypto headlines (title + link only) from public RSS feeds. The feeds only keep the latest few hours, so this runs every 20 minutes;
# if GitHub delays a run, nothing is lost as long as the next one comes within a few hours. See news.mjs.
name: Record headlines

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Record
        run: node news.mjs --save
